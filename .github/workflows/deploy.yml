name: Deploy docs site to GitHub Pages

# Builds the Docusaurus site in website/ and publishes it to GitHub Pages at
# ilmek.aimtune.dev (custom domain set by website/static/CNAME). The site is a
# standalone project — not part of the ts/ pnpm workspace — so it installs on its
# own. A path filter keeps engine-only changes from rebuilding the site.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel in-progress if a new one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Match the pnpm that generated website/pnpm-lock.yaml and reads the
          # settings in website/pnpm-workspace.yaml (verifyDepsBeforeRun etc.).
          version: 11

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node ≥ 22.13; 20 fails at pnpm startup.
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Guard: every og:image / twitter:image referenced in the built HTML must
      # resolve to a real file in the build output. Docusaurus does not validate
      # themeConfig.image, so a missing social card would otherwise slip through
      # (the ilmek-social-card.png 404 this guard was added for).
      - name: Verify social card assets exist in build output
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir, out = []) => {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p, out);
                else if (e.name.endsWith(".html")) out.push(p);
              }
              return out;
            };
            const root = "build";
            if (!fs.existsSync(root)) { console.error("no build/ directory"); process.exit(1); }
            const htmlFiles = walk(root);
            console.log(`checking ${htmlFiles.length} HTML files`);
            const re = /(?:og:image|twitter:image)[^>]*?content=(?:"([^"]+)"|([^\s>]+))/g;
            let checked = 0;
            for (const f of htmlFiles) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(re)) {
                const raw = m[1] || m[2];
                if (!raw) continue;
                const url = raw.startsWith("http")
                  ? new URL(raw)
                  : new URL(raw, "https://ilmek.aimtune.dev/");
                if (url.origin !== "https://ilmek.aimtune.dev") continue;
                const candidate = path.join(root, url.pathname.replace(/^\//, ""));
                if (!fs.existsSync(candidate)) {
                  console.error(`MISSING ${f} -> ${raw} (${candidate})`);
                  process.exit(1);
                }
                checked++;
                console.log(`OK ${f} -> ${raw}`);
              }
            }
            if (checked === 0) {
              console.error("no og:image/twitter:image references found in build output");
              process.exit(1);
            }
            console.log(`all ${checked} social image reference(s) resolve to build output`);
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
